[package]
name = "nod"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
documentation = "https://docs.rs/nod"
readme = "../README.md"
description = """
Library for reading and writing GameCube and Wii disc images.
"""
keywords.workspace = true
categories = ["command-line-utilities", "parser-implementations"]

[features]
# Codec backends are pure Rust; vendored/static names remain compatibility aliases.
default = [
    "compress-bzip2-vendored",
    "compress-lzma-vendored",
    "compress-zlib-vendored",
    "compress-zstd-vendored",
    "threading",
]
compress-bzip2 = ["dep:bzip2"]
compress-bzip2-vendored = ["compress-bzip2"]
compress-bzip2-static = ["compress-bzip2-vendored"]
compress-lzma = ["dep:lzma-rust2"]
compress-lzma-vendored = ["compress-lzma"]
compress-lzma-static = ["compress-lzma-vendored"]
compress-zlib = ["dep:adler2", "dep:flate2"]
compress-zlib-vendored = ["compress-zlib"]
compress-zlib-static = ["compress-zlib-vendored"]
compress-zstd = ["dep:structured-zstd"]
compress-zstd-vendored = ["compress-zstd"]
compress-zstd-static = ["compress-zstd-vendored"]
# Compatibility aliases: cryptography always uses RustCrypto.
openssl = []
openssl-vendored = ["openssl"]
python = ["dep:pyo3", "compress-bzip2-vendored", "compress-lzma-vendored", "compress-zlib-vendored", "compress-zstd-vendored", "threading"]
threading = ["dep:crossbeam-channel", "dep:crossbeam-utils"]

[dependencies]
adler2 = { version = "2.0", optional = true }
aes = "0.9.0-rc.4"
crypto-common = "0.2"
base16ct = "1.0"
block-padding = "0.4"
bytes = "1.11"
bzip2 = { version = "0.6.1", optional = true }
cbc = "0.2.0-rc.3"
crc32fast = "1.5"
digest = { workspace = true }
dyn-clone = "1.0"
encoding_rs = "0.8"
itertools = "0.14"
lzma-rust2 = { version = "0.21", default-features = false, features = ["std", "encoder"], optional = true }
lru = "0.18"
md-5 = { workspace = true }
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"], optional = true }
polonius-the-crab = "0.5"
sha1 = { workspace = true }
simple_moving_average = "1.0"
thiserror = "2.0"
tracing = { workspace = true }
xxhash-rust = { version = "0.8", features = ["xxh64"] }
zerocopy = { workspace = true }
structured-zstd = { workspace = true, optional = true }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
crossbeam-channel = { version = "0.5", optional = true }
crossbeam-utils = { version = "0.8", optional = true }
pyo3 = { version = "0.29", features = ["abi3-py310", "extension-module"], optional = true }
